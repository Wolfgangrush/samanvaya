# GitHub secret-scanning exclusions.
#
# samanvaya ships a credential firewall. A detector that has never been shown a
# secret-shaped string is an untested detector, so the test corpus deliberately
# contains non-functional, publicly-documented credential shapes:
#
#   tests/test_schema.py            negative-test parametrize list
#   tests/test_audit_regressions.py regression corpus
#   src/samanvaya/credentials.py    docstring examples of the shapes refused
#
# None of them are live. They are already allowlisted with a stated reason in
# .gitleaks.toml and accepted at docs/CSO_AUDIT_20260819.md finding 3.
#
# GitHub's scanner does not read .gitleaks.toml, which is why this file exists.
# It flagged "mongodb+srv://admin:pw@cluster.mongodb.net" on 2026-08-23
# (alert 1, resolved used_in_tests). This prevents the recurrence.
paths-ignore:
  - "tests/**"
  - "src/samanvaya/credentials.py"
